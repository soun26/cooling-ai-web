<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Cooling AI · Nghiên cứu</title><link rel="icon" href="/user/icon.svg"><link rel="stylesheet" href="research.css"><script src="/user/chat-stream.js" defer></script><script src="research.js" defer></script></head>
<body><header><a href="/">∿ COOLING <b>AI</b> <small>// RESEARCH</small></a><a class="mode-switch" href="/" title="Chọn chế độ">Research mode</a><span id="connection" role="status">…</span><button id="lang">EN</button></header>
<div id="entry" class="panel"><h1 data-vi="Đang mở Research…" data-en="Opening Research…"></h1><p data-vi="Đang tải danh sách case." data-en="Loading cases."></p><button id="retry" data-vi="Kết nối lại" data-en="Reconnect"></button></div>
<div id="workspace" hidden><nav id="nav"><button data-page="cases" class="active" data-vi="01 · Case" data-en="01 · Cases"></button><button data-page="import" data-vi="02 · Nhập FEA" data-en="02 · Import FEA"></button><button data-page="train" data-vi="03 · Train AI" data-en="03 · Train AI"></button><button data-page="live" data-vi="04 · Theo dõi" data-en="04 · Monitor"></button><button data-page="compare" data-vi="05 · Kiểm tra" data-en="05 · Compare"></button><button data-page="assistant" data-vi="06 · Trợ lý" data-en="06 · Assistant"></button><a href="/user/" target="_blank" data-vi="Tạo kênh / Gen →" data-en="Channel design / Gen →"></a></nav>
<main><section class="hero"><div><p class="eyebrow">// RESEARCH WORKSPACE</p><h1 data-vi="Kênh làm mát tiến hóa dạng sinh học" data-en="Bio-inspired evolutionary cooling channels"></h1><p id="summary"></p></div><button class="pet" id="pet" aria-label="Assistant"><span id="thought">…</span><i></i><i></i></button></section>
<p id="status" role="status"></p>
<section id="page-cases" class="page"><div class="panel"><div class="heading"><h2 data-vi="Dữ liệu trên máy chủ" data-en="Master dataset"></h2><button id="refresh" data-vi="Làm mới" data-en="Refresh"></button></div><div class="filters"><input id="search" type="search" aria-label="Search cases" placeholder="Case / geometry"><select id="cohort" aria-label="Cohort"><option value="Gen">Gen</option><option value="DOE">DOE</option></select><button id="select-visible" data-vi="Chọn danh sách" data-en="Select visible"></button><button id="clear-selection" data-vi="Bỏ chọn" data-en="Clear"></button></div><p id="selected-count"></p><div class="table-scroll"><table><thead><tr><th>✓</th><th>Case</th><th data-vi="Hình học" data-en="Geometry"></th><th>Gen</th><th>Split</th><th>Nodes</th><th>FEA</th></tr></thead><tbody id="cases"></tbody></table></div><details><summary data-vi="Thông số case đã chọn" data-en="Selected case parameters"></summary><pre id="case-detail"></pre></details><button class="primary" id="to-train" data-vi="Tiếp: Train AI →" data-en="Next: Train AI →"></button></div></section>
<section id="page-import" class="page" hidden><div class="panel"><h2 data-vi="Nhập case volume + FEA gốc" data-en="Import volume case + original FEA"></h2><p data-vi="Chọn 3 tệp của case đã xuất từ chương trình. Hệ thống kiểm tra mesh, nhãn và mã kiểm tra trước khi nhận." data-en="Choose the 3 files from a case exported by the application. Mesh, labels and checksums are verified before import."></p><form id="import-form"><label>1. manifest.json<input id="manifest" type="file" accept=".json" required></label><label>2. graph.npz<input id="graph-file" type="file" accept=".npz" required></label><label>3. ABAQUS Part_CoolTemperature<input id="source-file" type="file" accept=".inp" required></label><label>Split<select id="partition"><option>train</option><option>validation</option><option>test</option></select></label><p data-vi="Giữ split gốc nếu case đã khai báo. Một tệp FEA riêng chưa đủ: cần graph chứa đúng hình học, kênh và process." data-en="Keep the original declared split. A FEA file alone is insufficient: its graph must contain the matching geometry, channels and process."></p><button class="primary" data-vi="Tải lên và kiểm tra" data-en="Upload and verify"></button></form></div></section>
<section id="page-train" class="page" hidden><div class="panel"><h2 data-vi="Thiết lập lượt học" data-en="Configure training"></h2><p id="train-selection"></p><form id="train-form"><div class="fields"><label>Epochs<input id="epochs" type="number" value="100" min="1" max="10000" required></label><label>Hidden<input id="hidden" type="number" value="64" min="16" max="256" required></label><label>Message steps<input id="steps" type="number" value="6" min="1" max="12" required></label><label>Patience<input id="patience" type="number" value="40" min="1" max="500" required></label><label>RMSE ≤ (°C)<input id="rmse" type="number" value="1" step="0.01" min="0" max="100" required></label><label>MAE ≤ (°C)<input id="mae" type="number" value="0.5" step="0.01" min="0" max="100" required></label></div><label data-vi="Cách chia dữ liệu" data-en="Data split"></label><select id="split-mode"><option value="declared_cases" data-vi="Theo split từng case" data-en="Declared case splits"></option><option value="product" data-vi="Tách theo hình học" data-en="Split by geometry"></option></select><p data-vi="DOE học riêng. Thiếu validation/test vẫn có thể học thăm dò; kết quả không chứng minh độ đúng trên case mới." data-en="DOE is separate. Training without validation/test is exploratory and does not establish accuracy on unseen cases."></p><button class="primary" data-vi="Bắt đầu train" data-en="Start training"></button></form></div><div class="panel"><h2 data-vi="Model trên máy chủ" data-en="Available models"></h2><div id="models"></div><p data-vi="Lượt học tạo checkpoint mới. Model ACTIVE hiện tại giữ nguyên." data-en="Training creates a new checkpoint. The current ACTIVE model is retained."></p></div></section>
<section id="page-live" class="page" hidden><div class="panel"><div class="heading"><h2 data-vi="Tiến trình thực" data-en="Live progress"></h2><button id="stop" data-vi="Dừng tại checkpoint" data-en="Stop at checkpoint"></button></div><select id="jobs" aria-label="Training run"></select><p id="job-state"></p><div class="visual-grid"><div><h3 data-vi="Quá trình học" data-en="Learning curve"></h3><canvas id="curve" width="900" height="440"></canvas></div><div><h3 data-vi="Lưới học trực tiếp" data-en="Live learning graph"></h3><canvas id="mesh" width="900" height="440"></canvas></div></div><p id="graph-note"></p><div class="actions"><button id="save-curve" data-vi="Xuất biểu đồ PNG" data-en="Export chart PNG"></button><button id="save-mesh" data-vi="Xuất lưới PNG" data-en="Export graph PNG"></button><button id="save-history">History JSONL</button><button id="save-log" data-vi="Xuất log" data-en="Export log"></button></div><details><summary>Log</summary><pre id="log"></pre></details></div></section>
<section id="page-compare" class="page" hidden><div class="panel"><h2 data-vi="AI ↔ FEA" data-en="AI ↔ FEA"></h2><form id="compare-form"><label>Case<select id="compare-case" required></select></label><label>Model<select id="compare-model" required></select></label><button class="primary" data-vi="Dự đoán và so sánh" data-en="Predict and compare"></button></form><p id="comparison-scope"></p><div id="metrics" class="fields"></div><div class="actions"><button id="export-report">Report JSON</button><button id="export-nodes">Nodes CSV</button><button id="export-comparison" data-vi="Log so sánh" data-en="Comparison log"></button></div></div></section>
<section id="page-assistant" class="page" hidden><div class="panel"><h2 data-vi="Soun · Trợ lý" data-en="Soun · Assistant"></h2><div id="chat" aria-live="polite"></div><form id="chat-form"><label data-vi="Câu hỏi" data-en="Question" for="question"></label><textarea id="question" required maxlength="3000" rows="3"></textarea><button class="primary" data-vi="Gửi" data-en="Send"></button></form></div></section>
<footer><span>Bản quyền thuộc về Tienle - FDUT team</span><button id="copy-link" hidden data-vi="Sao chép link nghiên cứu" data-en="Copy research link"></button></footer></main></div></body></html>
